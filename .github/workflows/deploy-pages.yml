name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./caresync-frontend
        run: npm install --legacy-peer-deps

      - name: Build static export for GitHub Pages
        working-directory: ./caresync-frontend
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/CareSync'
        run: |
          npm run build
          mv out/_next out/next
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.txt' \) \
            -exec sed -i 's#/_next/#/next/#g' {} +
          touch out/.nojekyll

      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./caresync-frontend/out
          publish_branch: gh-pages
          force_orphan: true
