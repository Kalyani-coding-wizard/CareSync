name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./caresync-frontend
        run: npm install --legacy-peer-deps

      - name: Build static export for GitHub Pages
        working-directory: ./caresync-frontend
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/CareSync'
        run: |
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('out');
          const source = path.join(root, '_next');
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          };
          walk(source);
          const replacements = new Map();
          for (const file of files) {
            const relative = path.relative(source, file).split(path.sep).join('-');
            const target = path.join(root, `asset-${relative}`);
            fs.copyFileSync(file, target);
            replacements.set(`/_next/${path.relative(source, file).split(path.sep).join('/')}`, `/${path.basename(target)}`);
          }
          const rewrite = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (full === source) continue;
              if (entry.isDirectory()) rewrite(full);
              else if (/\.(html|js|css|txt)$/.test(entry.name)) {
                let content = fs.readFileSync(full, 'utf8');
                for (const [from, to] of replacements) content = content.split(from).join(to);
                fs.writeFileSync(full, content);
              }
            }
          };
          rewrite(root);
          fs.rmSync(source, { recursive: true, force: true });
          NODE
          touch out/.nojekyll

      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./caresync-frontend/out
          publish_branch: gh-pages
          force_orphan: true
